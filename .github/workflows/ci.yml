name: CI

on:
  push:
    branches:
      - 'codex/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  miniprogram:
    name: Mini Program checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Run Node tests
        run: npm test
      - name: Validate Mini Program
        run: npm run validate:miniprogram
      - name: Validate production configuration
        env:
          MINIPROGRAM_VALIDATE_SYNTHETIC: '1'
        run: npm run validate:production

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend development dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest
      - name: Run ruff
        working-directory: backend
        run: ruff check app tests alembic
      - name: Validate production configuration
        working-directory: backend
        run: |
          python - <<'PY'
          from app.config import Settings

          settings = Settings(
              app_env="production",
              _env_file=None,
              public_base_url="https://media-api.valid-domain.cn",
              wechat_app_id="wx1234567890abcdef",
              wechat_app_secret="0123456789abcdef0123456789abcdef",
              app_token_secret="A1b2C3d4E5f6G7h8I9j0K1l2M3n4O5p6",
              mock_wechat_auth=False,
              dev_bypass_download_entitlement=False,
              download_access_mode="free",
          )
          assert settings.media_access_token_ttl_seconds == 900
          assert settings.media_session_ttl_seconds == 86400
          assert settings.download_access_mode == "free"
          assert settings.mock_wechat_auth is False
          assert settings.dev_bypass_download_entitlement is False
          PY
      - name: Compile backend sources
        working-directory: backend
        run: python -m compileall -q app alembic
      - name: Upgrade empty SQLite database with Alembic
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./data/ci-empty.db
        run: python -m alembic upgrade head
      - name: Verify Alembic head
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./data/ci-empty.db
        run: python -c "from app.database import Database; db = Database('sqlite:///./data/ci-empty.db'); db.verify_alembic_head(); db.close()"
      - name: Build backend Docker image
        run: docker build --tag video-extractor-backend:ci ./backend
      - name: Smoke test production container startup and restart
        timeout-minutes: 4
        run: |
          set -euo pipefail
          trap 'docker rm --force --volumes backend-smoke >/dev/null' EXIT
          # Synthetic credentials only; no real WeChat or public network requests.
          docker run --detach --name backend-smoke \
            --mount type=volume,destination=/app/data \
            --mount type=volume,destination=/app/tmp/media \
            --env APP_ENV=production \
            --env PUBLIC_BASE_URL=https://media-api.example.invalid \
            --env WECHAT_APP_ID=wx1234567890abcdef \
            --env WECHAT_APP_SECRET=0123456789abcdef0123456789abcdef \
            --env APP_TOKEN_SECRET=A1b2C3d4E5f6G7h8I9j0K1l2M3n4O5p6 \
            --env MOCK_WECHAT_AUTH=false \
            --env DEV_BYPASS_DOWNLOAD_ENTITLEMENT=false \
            --env DOWNLOAD_ACCESS_MODE=free \
            --env DOUYIN_SESSION_ENABLED=false \
            --env DATABASE_URL=sqlite:////app/data/app.db \
            --env TEMP_DIR=/app/tmp/media \
            video-extractor-backend:ci
          wait_healthy() {
            for attempt in $(seq 1 30); do
              if [ "$(docker inspect --format '{{.State.Health.Status}}' backend-smoke)" = healthy ]; then
                return 0
              fi
              if [ "$(docker inspect --format '{{.State.Running}}' backend-smoke)" != true ]; then
                break
              fi
              sleep 2
            done
            docker logs backend-smoke
            return 1
          }
          wait_healthy
          docker exec backend-smoke python -c "import os; from pathlib import Path; assert os.getuid() != 0; assert b'uvicorn' in Path('/proc/1/cmdline').read_bytes()"
          docker exec backend-smoke ffmpeg -version >/dev/null
          # Exercise online backup and recovery using one synthetic record.
          docker exec backend-smoke python -c "from app.database import Database; from app.models import User; db = Database('sqlite:////app/data/app.db'); session = db.session_factory(); session.add(User(openid='ci-backup-probe')); session.commit(); session.close(); db.close()"
          docker exec backend-smoke python -m app.backup /app/data/app.db /app/data/ci-backup.db
          docker exec backend-smoke python -m app.backup /app/data/ci-backup.db /app/data/ci-restored.db
          docker exec backend-smoke python -c "from sqlalchemy import select; from app.database import Database; from app.models import User; db = Database('sqlite:////app/data/ci-restored.db'); db.verify_alembic_head(); session = db.session_factory(); assert session.scalar(select(User).where(User.openid == 'ci-backup-probe')) is not None; session.close(); db.close()"
          docker stop --time 30 backend-smoke
          case "$(docker inspect --format '{{.State.ExitCode}}' backend-smoke)" in
            0|143) ;; # Normal exit or propagated SIGTERM, never SIGKILL (137).
            *) echo 'Container did not stop gracefully'; exit 1 ;;
          esac
          docker start backend-smoke
          wait_healthy
          docker exec backend-smoke python -c "from sqlalchemy import select; from app.database import Database; from app.models import User; db = Database('sqlite:////app/data/app.db'); db.verify_alembic_head(); session = db.session_factory(); assert session.scalar(select(User).where(User.openid == 'ci-backup-probe')) is not None; session.close(); db.close()"
      - name: Validate Caddy configuration
        run: |
          docker run --rm \
            --env API_DOMAIN=example.invalid \
            --volume "${{ github.workspace }}/deploy/Caddyfile.example:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.0-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
