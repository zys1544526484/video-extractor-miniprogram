name: CI

on:
  push:
    branches:
      - 'codex/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  miniprogram:
    name: Mini Program checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Run Node tests
        run: npm test
      - name: Validate Mini Program
        run: npm run validate:miniprogram

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend development dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest
      - name: Run ruff
        working-directory: backend
        run: ruff check app tests alembic
